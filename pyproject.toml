[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailocal-universal"
version = "0.2.0"
description = "Plataforma cognitiva local, adaptativa e distribuída"
readme = "README.md"
license = "LicenseRef-AILocal-Universal-Proprietary"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
documents = ["pypdf>=7.1.1,<8"]

[project.scripts]
ailocal = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "engines*", "pipeline*", "resources*", "knowledge*", "swarm*", "storage*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
