[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailocal-universal"
version = "0.1.0"
description = "Plataforma cognitiva local, adaptativa e distribuída"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ailocal = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "engines*", "pipeline*", "resources*", "knowledge*", "swarm*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
