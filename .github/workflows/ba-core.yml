name: BA Core

on:
  push:
    branches:
      - feature/ba-core-homeostasis-v0.4
      - feature/ba-core-signal-ecology-v0.3
      - feature/ba-core-benchmark-matrix-v0.2
      - feature/ba-core-spatial-adaptation-v0.1
  pull_request:
    branches:
      - feature/ba-developmental-substrate-contracts-v0.1
      - feature/ba-core-spatial-adaptation-v0.1
      - feature/ba-core-benchmark-matrix-v0.2
      - feature/ba-core-signal-ecology-v0.3
      - integration/unified-architecture-v1
    paths:
      - "ba_core/**"
      - "docs/BA_CORE_V0.4_HOMEOSTASIS.md"
      - "docs/BA_CORE_V0.3_SIGNAL_ECOLOGY.md"
      - "docs/BA_CORE_V0.1_VALIDATION.md"
      - ".github/workflows/ba-core.yml"

jobs:
  ba-core-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ba_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
