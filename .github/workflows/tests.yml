name: Tests

on:
  push:
    branches:
      - main
      - bootstrap/project-structure
      - feature/rag-v1
      - feature/neural-model-hub-v1
      - feature/adaptive-resource-manager-v1
      - feature/chat-management-resource-profiles-v1
      - feature/neural-elastic-simulator-v1
      - feature/napa-cognitive-area-registry-v1
      - feature/nesa-semantic-page-indexer-v0.1
      - feature/kia-rust-cognitive-runtime-v0.1
      - feature/kia-runtime-host-bridge-v0.2
      - feature/kia-acca-vertical-flow-v0.3
      - feature/kia-persistent-semantic-memory-v0.4
      - feature/kia-execution-safety-v0.5
      - integration/unified-architecture-v1
  pull_request:
    branches:
      - feature/ba-developmental-substrate-contracts-v0.1
      - feature/ba-core-spatial-adaptation-v0.1
      - integration/unified-architecture-v1
      - main
      - bootstrap/project-structure
      - feature/rag-v1
      - feature/neural-model-hub-v1
      - feature/adaptive-resource-manager-v1
      - feature/chat-management-resource-profiles-v1
      - feature/neural-elastic-simulator-v1
      - feature/napa-cognitive-area-registry-v1
      - feature/nesa-semantic-page-indexer-v0.1
      - feature/kia-rust-cognitive-runtime-v0.1
      - feature/kia-runtime-host-bridge-v0.2
      - feature/kia-acca-vertical-flow-v0.3
      - feature/kia-persistent-semantic-memory-v0.4
      - feature/kia-execution-safety-v0.5

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Run unit tests
        run: python -m pytest -q

  kba-rust-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kba
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets
