name: Tests

on:
  push:
    branches:
      - main
      - bootstrap/project-structure
      - feature/rag-v1
      - feature/neural-model-hub-v1
      - feature/adaptive-resource-manager-v1
      - feature/chat-management-resource-profiles-v1
  pull_request:
    branches:
      - main
      - bootstrap/project-structure
      - feature/rag-v1
      - feature/neural-model-hub-v1
      - feature/adaptive-resource-manager-v1
      - feature/chat-management-resource-profiles-v1

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Run unit tests
        run: python -m pytest -q
